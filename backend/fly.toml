# Fly.io app definition for the NIRVAPROCURE backend.
#
# Bring-up:
#   flyctl launch --no-deploy --copy-config        # creates app + region
#   flyctl postgres create --name nirva-pg         # provision Postgres
#   flyctl postgres attach nirva-pg                # injects DATABASE_URL
#   flyctl secrets set \
#     JWT_SECRET=$(openssl rand -hex 48) \
#     WEB_ORIGIN=https://nirvaprocure.com \
#     LINE_CHANNEL_ACCESS_TOKEN=... \
#     LINE_CHANNEL_SECRET=... \
#     OPENAI_API_KEY=...
#   flyctl deploy                                  # build + ship the image

app            = "nirva-backend"
primary_region = "sin"                              # Singapore — closest to TH
kill_signal    = "SIGINT"
kill_timeout   = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT     = "8080"
  LOG_LEVEL = "info"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes           = ["app"]

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period  = "30s"
    interval      = "15s"
    method        = "get"
    path          = "/v1/health"
    protocol      = "http"
    timeout       = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
