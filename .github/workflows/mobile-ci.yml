name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Flutter — analyze + test
  # Runs on every PR that touches mobile/ — fast (~2 min, no Android SDK needed)
  # ---------------------------------------------------------------------------
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: mobile/coverage/lcov.info
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Build APK — only on main, skipped if no Android signing secrets
  # Produces a debug APK as a build artefact; swap for --release + keystore
  # when ready for Play Store
  # ---------------------------------------------------------------------------
  build-apk:
    name: Build APK (debug)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: flutter
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE=https://api.nirvaprocure.com/v1

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nirvaprocure-debug-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
