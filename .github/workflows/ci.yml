name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Frontend — typecheck + lint + build + Playwright E2E
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/v1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run e2e
        env:
          # Smoke tests use the offline mock fallback baked into pages — no
          # backend service needed.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/v1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Backend — typecheck + unit tests against ephemeral Postgres
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nirva
          POSTGRES_PASSWORD: nirva
          POSTGRES_DB: nirvaprocure_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U nirva -d nirvaprocure_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Apply all schemas and seed
        run: |
          PG="PGPASSWORD=nirva psql -h localhost -U nirva -d nirvaprocure_test"
          eval "$PG -f ../database/phase1_schema.sql"
          eval "$PG -f ../database/phase2_stock_schema.sql"
          eval "$PG -f ../database/phase2_gov_schema.sql"
          eval "$PG -f ../database/phase4_2fa_schema.sql"
          eval "$PG -f ../database/phase4_portal_schema.sql"
          eval "$PG -f ../database/phase5_anomaly_schema.sql"
          eval "$PG -f ../database/phase5_budget_schema.sql"
          eval "$PG -f ../database/phase5_comments_schema.sql"
          eval "$PG -f ../database/phase5_incentives_schema.sql"
          eval "$PG -f ../database/phase5_webhooks_schema.sql"
          eval "$PG -f ../database/phase6_affiliate_schema.sql"
          eval "$PG -f ../database/phase6_ai_runs_schema.sql"
          eval "$PG -f ../database/phase6_line_binding_schema.sql"
          eval "$PG -f ../database/phase6_locale_schema.sql"
          eval "$PG -f ../database/phase6_pdpa_consent_schema.sql"
          eval "$PG -f ../database/phase6_supplier_risk_schema.sql"
          eval "$PG -f ../database/phase7_attachments_schema.sql"
          eval "$PG -f ../database/phase7_fcm_schema.sql"
          eval "$PG -f ../database/phase7_po_schema.sql"
          eval "$PG -f ../database/seed.sql"

      - name: Build
        run: npx nest build

      - name: Tests
        run: npm test
        env:
          DATABASE_URL: postgres://nirva:nirva@localhost:5432/nirvaprocure_test
          JWT_SECRET: ci-test-secret

  # ---------------------------------------------------------------------------
  # Docker images — built only on main, pushed only when DOCKER_HUB secrets exist
  # ---------------------------------------------------------------------------
  docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/nirvaprocure-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/nirvaprocure-web:${{ github.sha }}
