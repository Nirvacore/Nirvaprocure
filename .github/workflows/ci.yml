name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Frontend — typecheck + lint + build + Playwright E2E
  # ---------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/v1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run e2e
        env:
          # Smoke tests use the offline mock fallback baked into pages — no
          # backend service needed.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/v1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Backend — typecheck + unit tests against ephemeral Postgres
  # ---------------------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nirva
          POSTGRES_PASSWORD: nirva
          POSTGRES_DB: nirvaprocure_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U nirva -d nirvaprocure_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint "src/**/*.ts"

      - name: Apply all schemas and seed
        run: |
          PG="PGPASSWORD=nirva psql -h localhost -U nirva -d nirvaprocure_test"
          eval "$PG -f ../database/phase1_schema.sql"
          eval "$PG -f ../database/phase2_stock_schema.sql"
          eval "$PG -f ../database/phase2_gov_schema.sql"
          eval "$PG -f ../database/phase4_2fa_schema.sql"
          eval "$PG -f ../database/phase4_portal_schema.sql"
          eval "$PG -f ../database/phase5_anomaly_schema.sql"
          eval "$PG -f ../database/phase5_budget_schema.sql"
          eval "$PG -f ../database/phase5_comments_schema.sql"
          eval "$PG -f ../database/phase5_incentives_schema.sql"
          eval "$PG -f ../database/phase5_webhooks_schema.sql"
          eval "$PG -f ../database/phase6_affiliate_schema.sql"
          eval "$PG -f ../database/phase6_ai_runs_schema.sql"
          eval "$PG -f ../database/phase6_line_binding_schema.sql"
          eval "$PG -f ../database/phase6_locale_schema.sql"
          eval "$PG -f ../database/phase6_pdpa_consent_schema.sql"
          eval "$PG -f ../database/phase6_supplier_risk_schema.sql"
          eval "$PG -f ../database/phase7_attachments_schema.sql"
          eval "$PG -f ../database/phase7_fcm_schema.sql"
          eval "$PG -f ../database/phase7_po_schema.sql"
          eval "$PG -f ../database/seed.sql"

      - name: RLS enforcement check
        run: |
          echo "Scanning for pool.query in request-scoped services (must use withOrg)..."
          # Allow-listed files that intentionally use raw pool.query:
          #   - Background jobs (scan all orgs): reorder-scan.job.ts, anomaly-scan.job.ts
          #   - Auth (pre-login, no org context): auth.controller.ts, google-oauth.service.ts, totp.service.ts
          #   - Health check (SELECT 1): health.controller.ts
          #   - FCM (user-scoped tokens, not org-scoped): fcm.service.ts
          #   - LINE webhooks (user-scoped lookups): line-webhook.controller.ts, line.notifier.ts
          #   - Portal (token-auth, explicit org_id filter): portal.service.ts
          #   - Webhook emit/deliver (called from background): webhooks.service.ts
          #   - Budget check (called from background jobs): budget.service.ts
          #   - Anomaly record/coi (background operations): anomaly.service.ts
          #   - Supplier risk compute (background): supplier-risk.service.ts
          #   - Savings recompute (cron): savings.service.ts
          #   - AI cost tracking (no org data): openai.provider.ts
          #   - Affiliate internals (fire-and-forget): affiliate.service.ts (loadConfig, recordClick only)
          ALLOWLIST="reorder-scan.job.ts|anomaly-scan.job.ts|auth.controller.ts|google-oauth.service.ts|totp.service.ts|health.controller.ts|fcm.service.ts|line-webhook.controller.ts|line.notifier.ts|portal.service.ts|notifications.controller.ts|webhooks.service.ts|budget.service.ts|anomaly.service.ts|supplier-risk.service.ts|savings.service.ts|openai.provider.ts|affiliate.service.ts|with-org.ts|db.module.ts"
          VIOLATIONS=$(grep -rn 'pool\.query\|this\.pool\.query' src/modules/ src/common/ \
            --include='*.ts' \
            | grep -v 'withOrg' \
            | grep -vE "$ALLOWLIST" \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ RLS VIOLATION — pool.query used outside withOrg in non-allowlisted files:"
            echo "$VIOLATIONS"
            echo ""
            echo "Fix: wrap the query with withOrg(this.pool, orgId, async (c) => { ... })"
            echo "If this is intentional (background job, pre-auth), add the file to the allowlist above."
            exit 1
          fi
          echo "✅ No RLS violations found"

      - name: Build
        run: npx nest build

      - name: Tests
        run: npm test
        env:
          DATABASE_URL: postgres://nirva:nirva@localhost:5432/nirvaprocure_test
          JWT_SECRET: ci-test-secret

  # ---------------------------------------------------------------------------
  # Docker images — built only on main, pushed only when DOCKER_HUB secrets exist
  # ---------------------------------------------------------------------------
  docker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/nirvaprocure-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/nirvaprocure-web:${{ github.sha }}
